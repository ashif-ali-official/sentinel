server:
  port: 8085

spring:
  application:
    name: assignment-service

  datasource:
    url: jdbc:mysql://localhost:3307/sentinel_assignment_db
    username: sentinel
    password: rootAdmin

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: sentinel-assignment-service
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.value.default.type: com.sentinel.assignment.kafka.event.CaseCreatedEvent
        spring.json.trusted.packages: com.sentinel.assignment.kafka.event
        spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5


    listener:
      ack-mode: record

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

sentinel:
  security:
    cognito:
      issuer-uri: ${COGNITO_ISSUER_URI:https://cognito-idp.ap-south-2.amazonaws.com/ap-south-2_ubJidtLKC}
      client-id: ${COGNITO_CLIENT_ID:54bk5r8of48un0ke77r2pk29i5}
  outbox:
    publish-delay: 2000
    batch-size: 20
    max-attempts: 5

  services:
    player:
      base-url: http://localhost:8084