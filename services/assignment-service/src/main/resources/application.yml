server:
  port: 8085

spring:
  application:
    name: assignment-service

  datasource:
    url: jdbc:mysql://localhost:3307/sentinel_assignment_db
    username: sentinel
    password: rootAdmin

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: sentinel-assignment-service
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.value.default.type: com.sentinel.assignment.kafka.event.CaseCreatedEvent
        spring.json.trusted.packages: com.sentinel.assignment.kafka.event
        spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer

    listener:
      ack-mode: record

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

sentinel:
  services:
    player:
      base-url: http://localhost:8084