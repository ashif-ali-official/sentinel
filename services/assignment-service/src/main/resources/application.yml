server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: assignment-service

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    consumer:
      group-id: sentinel-assignment-service
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.value.default.type: com.sentinel.assignment.kafka.event.CaseCreatedEvent
        spring.json.trusted.packages: com.sentinel.assignment.kafka.event
        spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5


    listener:
      ack-mode: record

management:
  endpoints:
    web:
      exposure:
        include: ${ACTUATOR_EXPOSED_ENDPOINTS:health}

sentinel:
  security:
    cognito:
      issuer-uri: ${COGNITO_ISSUER_URI}
      client-id: ${COGNITO_CLIENT_ID}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  outbox:
    publish-delay: 2000
    batch-size: 20
    max-attempts: 5

  services:
    player:
      base-url: ${PLAYER_SERVICE_URL}
