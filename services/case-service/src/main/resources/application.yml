server:
  port: 8082

spring:
  application:
    name: case-service

  datasource:
    url: jdbc:mysql://localhost:3307/sentinel_case_db
    username: sentinel
    password: rootAdmin
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: sentinel-case-service
      auto-offset-reset: earliest
      enable-auto-commit: false

      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

      max-poll-records: 10

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all

    listener:
      ack-mode: manual

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://cognito-idp.ap-south-2.amazonaws.com/ap-south-2_ubJidtLKC

sentinel:
  kafka:
    topics:
      report-created: sentinel.report.created
      case-created: sentinel.case.created
      case-assigned: sentinel.case.assigned

  security:
    cognito:
      issuer-uri: https://cognito-idp.ap-south-2.amazonaws.com/ap-south-2_ubJidtLKC
      client-id: 54bk5r8of48un0ke77r2pk29i5

management:
  endpoints:
    web:
      exposure:
        include: health,info
