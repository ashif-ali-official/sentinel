server:
  port: 8086

spring:
  application:
    name: moderation-service
  datasource:
    url: jdbc:mysql://localhost:3307/sentinel_moderation_db
    username: sentinel
    password: rootAdmin

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: sentinel-moderation-service
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      max-poll-records: 10
    listener:
      ack-mode: manual
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all

sentinel:
  security:
    cognito:
      issuer-uri: ${COGNITO_ISSUER_URI:https://cognito-idp.ap-south-2.amazonaws.com/ap-south-2_ubJidtLKC}
      client-id: ${COGNITO_CLIENT_ID:54bk5r8of48un0ke77r2pk29i5}
  kafka:
    topics:
      case-assigned: sentinel.case.assigned
      moderation-decision-made: sentinel.moderation.decision-made

  outbox:
    publish-delay: 2000
    batch-size: 20
    max-attempts: 5

management:
  endpoints:
    web:
      exposure:
        include: health,info
