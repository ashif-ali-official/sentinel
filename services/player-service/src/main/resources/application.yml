server:
  port: 8084

spring:
  application:
    name: player-service

  datasource:
    url: jdbc:mysql://localhost:3307/sentinel_player_db
    username: sentinel
    password: rootAdmin
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info

sentinel:
  security:
    cognito:
      issuer-uri: ${COGNITO_ISSUER_URI:https://cognito-idp.ap-south-2.amazonaws.com/ap-south-2_ubJidtLKC}
      client-id: ${COGNITO_CLIENT_ID:54bk5r8of48un0ke77r2pk29i5}
