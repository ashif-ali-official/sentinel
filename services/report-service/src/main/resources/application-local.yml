server:
  port: 8081
spring:
  datasource:
    url: jdbc:mysql://localhost:3307/sentinel_report_db
    username: sentinel
    password: ${MYSQL_PASSWORD}
  jpa:
    show-sql: true
  kafka:
    bootstrap-servers: localhost:9092
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,circuitbreakers
  endpoint:
    health:
      show-details: always
sentinel:
  security:
    cognito:
      issuer-uri: ${COGNITO_ISSUER_URI:https://cognito-idp.ap-south-2.amazonaws.com/ap-south-2_ubJidtLKC}
      client-id: ${COGNITO_CLIENT_ID:54bk5r8of48un0ke77r2pk29i5}
  cors:
    allowed-origins: http://localhost:5173
  services:
    player:
      base-url: http://localhost:8084
