server:
  port: 8081

spring:
  application:
    name: report-service

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/sentinel_report_db}
    username: ${DB_USERNAME:sentinel}
    password: ${DB_PASSWORD:rootAdmin}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all

management:
  endpoints:
    web:
      exposure:
        include: health,info