server:
  port: 8087
spring:
  application:
    name: sanction-service
  datasource:
    url: jdbc:mysql://localhost:3307/sentinel_sanction_db
    username: sentinel
    password: rootAdmin
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: sentinel-sanction-service
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      max-poll-records: 10
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
    listener:
      ack-mode: manual
sentinel:
  security:
    cognito:
      issuer-uri: ${COGNITO_ISSUER_URI:https://cognito-idp.ap-south-2.amazonaws.com/ap-south-2_ubJidtLKC}
      client-id: ${COGNITO_CLIENT_ID:54bk5r8of48un0ke77r2pk29i5}
  kafka:
    topics:
      moderation-decision-made: sentinel.moderation.decision-made
      sanction-applied: sentinel.sanction.applied
      appeal-decided: sentinel.appeal.decided
      sanction-reversed: sentinel.sanction.reversed
  outbox:
    publish-delay: 2000
    batch-size: 20
    max-attempts: 5
management:
  endpoints:
    web:
      exposure:
        include: health,info
